<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commands</title>
<link rel="stylesheet" href="/sdk/theme.css">
</head>
<body>
<main class="sdk-app">
  <h1>Validated command</h1>
  <input id="name" value="World" aria-label="Name">
  <button class="sdk-button" id="greet" type="button">Greet</button>
  <p id="result"></p>
</main>
<script type="module">
import {createClient} from "/sdk/client.js";

const client = createClient();
document.getElementById("greet").addEventListener("click", async () => {
  const name = document.getElementById("name").value;
  const result = await client.invokeCommand("greet", {name});
  document.getElementById("result").textContent = result.message;
});
</script>
</body>
</html>
