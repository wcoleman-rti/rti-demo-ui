name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . -e '.[dev]'
      - run: PYTHONPATH=python pytest tests/py/test_model_and_http.py -v
      - run: pip install ruff==0.6.2
      - run: ruff check python examples/py tests/py
      - run: ruff format --check python examples/py tests/py

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DBUILD_TESTING=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  browser:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . -e '.[dev]'
      - run: playwright install --with-deps chromium
      - run: PYTHONPATH=python pytest tests/browser -v
