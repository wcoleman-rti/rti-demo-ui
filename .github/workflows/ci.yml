name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cache/fetchcontent

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[test,lint]'
      - run: PYTHONPATH=python pytest tests/py -v
      - run: ruff check python examples/py tests/py
      - run: ruff format --check python examples/py tests/py

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('cpp/CMakeLists.txt') }}
      - run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('cpp/CMakeLists.txt') }}
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pyproject.toml') }}
      - run: npm ci --ignore-scripts
        working-directory: tools/scene3d
      - run: npm run build:runtime3d
        working-directory: tools/scene3d
      - run: sha256sum --check assets/runtime3d.sha256
      - run: git diff --exit-code -- assets/runtime3d.js assets/runtime3d.sha256
      - run: >-
          cmake -S . -B build-browser
          -DBUILD_TESTING=OFF
          -DRTI_DEMO_BUILD_EXAMPLES=ON
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
      - run: cmake --build build-browser --target rti_demo_ui_arm3d --parallel
      - run: |
          ARM3D="$(find "$PWD/build-browser" -type f -name rti_demo_ui_arm3d -perm -111 -print -quit)"
          test -n "$ARM3D"
          test -x "$ARM3D"
          echo "RTI_DEMO_CPP_ARM3D=$ARM3D" >> "$GITHUB_ENV"
      - run: pip install -e '.[browser]'
      - run: playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium
      - run: PYTHONPATH=python pytest tests/browser -v

  native-python-wheel-package:
    name: Native Python wheel package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Python wheels
        run: |
          wheel_dir="$RUNNER_TEMP/native-wheels"
          mkdir -p "$wheel_dir"
          python -m pip wheel --no-deps --wheel-dir "$wheel_dir" . native/python
      - name: Smoke-test installed wheel packages
        run: |
          wheel_dir="$RUNNER_TEMP/native-wheels"
          core_wheel="$(find "$wheel_dir" -maxdepth 1 -name 'rti_demo_ui-*.whl' -print -quit)"
          native_wheel="$(find "$wheel_dir" -maxdepth 1 -name 'rti_demo_ui_native-*.whl' -print -quit)"
          test -n "$core_wheel"
          test -n "$native_wheel"
          venv="$RUNNER_TEMP/native-wheel-smoke"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install "$core_wheel"
          "$venv/bin/python" -m pip install --no-deps "$native_wheel"
          (
            cd "$RUNNER_TEMP"
            "$venv/bin/python" - <<'PY'
          import sys

          from rti_demo_ui import DemoUiApp
          from rti_demo_ui_native import run_native

          app = DemoUiApp("Native wheel package smoke")
          assert not app.run_started
          assert callable(run_native)
          assert "webview" not in sys.modules
          PY
          )
      - name: Upload native Python wheels
        uses: actions/upload-artifact@v4
        with:
          name: native-python-wheels
          path: ${{ runner.temp }}/native-wheels/*.whl
          if-no-files-found: error

  native-webview-platforms:
    name: Native webview (${{ matrix.os }})
    needs: native-python-wheel-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            native/python/pyproject.toml
      - name: Cache native CMake dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: >-
            ${{ runner.os }}-native-cmake-deps-${{
            hashFiles(
              'cpp/CMakeLists.txt',
              'native/cpp/CMakeLists.txt'
            ) }}
      - name: Install Linux native-engine prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgl1-mesa-dri \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            xvfb
      - name: Install Python test and native-host dependencies
        run: >
          python -m pip install -e . -e native/python
          pytest==8.4.2 pytest-asyncio==1.4.0
      - name: Configure native companion and examples
        run: >-
          cmake -S native/cpp -B build/native-platform
          -DBUILD_TESTING=ON
          -DRTI_DEMO_NATIVE_BUILD_EXAMPLES=ON
          -DRTI_DEMO_NATIVE_REAL_ENGINE_TESTS=ON
          "-DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE_DIR }}"
      - name: Build native companion and examples
        run: cmake --build build/native-platform --config Release --parallel
      - name: Configure external C++ consumer
        run: >-
          cmake -S native/cpp/tests/consumer -B build/native-consumer
          "-DRTI_DEMO_UI_SOURCE_DIR=${{ github.workspace }}"
          "-DFETCHCONTENT_BASE_DIR=${{ env.FETCHCONTENT_BASE_DIR }}"
      - name: Build external C++ consumer
        run: cmake --build build/native-consumer --config Release --parallel
      - name: Download native Python wheels
        uses: actions/download-artifact@v4
        with:
          name: native-python-wheels
          path: ${{ runner.temp }}/native-wheels
      - name: Run Python lifecycle tests
        run: python -m pytest native/python/tests -q
      - name: Run C++ lifecycle tests
        run: >-
          ctest --test-dir build/native-platform
          -C Release
          --output-on-failure
          -LE real_engine
      - name: Install built wheels for native-host tests
        run: >-
          python -c "import glob, os, subprocess, sys; wheels=glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'native-wheels', '*.whl')); assert len(wheels) == 2, wheels; subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', *wheels], check=True)"
      - name: Run Linux native-host tests
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" \
            bash -euo pipefail <<'SCRIPT'
          work="$RUNNER_TEMP/native-webview"
          mkdir -p "$work"

          XDG_DATA_HOME="$work/python-signal" \
            timeout --kill-after=5s --preserve-status --signal=INT 4s \
            python - <<'PY'
          from rti_demo_ui import DemoUiApp
          from rti_demo_ui_native import run_native

          run_native(
              DemoUiApp("Native Python signal smoke"),
              application_id="org.rti.python-signal",
          )
          PY

          XDG_DATA_HOME="$work/cpp-lifecycle" \
            ctest --test-dir build/native-platform \
              -C Release --output-on-failure -L real_engine
          XDG_DATA_HOME="$work/cpp-consumer" \
            ctest --test-dir build/native-consumer \
              -C Release --output-on-failure -L real_engine
          XDG_DATA_HOME="$work/installed-wheel" \
            timeout 40s python \
              "$GITHUB_WORKSPACE/native/python/tests/real_host_smoke.py"
          XDG_DATA_HOME="$work/conformance" \
            timeout 90s python native/python/tests/hosted_conformance.py \
              --build-dir build/native-platform \
              --static-root tests/fixtures/native_webview_conformance \
              | tee "$work/conformance.log"
          SCRIPT
      - name: Run native C++ real-engine smoke
        if: runner.os != 'Linux'
        run: >-
          ctest --test-dir build/native-platform -C Release --output-on-failure -L real_engine
      - name: Run external C++ consumer smoke
        if: runner.os != 'Linux'
        run: >-
          ctest --test-dir build/native-consumer -C Release --output-on-failure -L real_engine
      - name: Run hosted native conformance
        if: runner.os != 'Linux'
        run: >-
          python native/python/tests/hosted_conformance.py
          --build-dir build/native-platform
          --static-root tests/fixtures/native_webview_conformance
      - name: Run installed-wheel native-host smoke
        if: runner.os != 'Linux'
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/native/python/tests/real_host_smoke.py"
      - name: Retain native diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-webview-logs
          path: ${{ runner.temp }}/native-webview/*.log
