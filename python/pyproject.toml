[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rti-demo-gui-sdk-core"
version = "0.1.0"
description = "RTI Demo GUI SDK Core for Python (standard-library ThreadingHTTPServer backend)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "playwright==1.46.0",
    "clang-format==18.1.8",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py310"
