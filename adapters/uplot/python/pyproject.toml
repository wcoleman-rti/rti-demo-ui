[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rti-demo-ui-adapter-uplot"
version = "1.0.0"
description = "Optional locally served uPlot adapter for RTI Demo UI"
requires-python = ">=3.11"
dependencies = ["rti-demo-ui>=0.4.1,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rti_demo_ui_adapter_uplot = ["_assets/*"]
