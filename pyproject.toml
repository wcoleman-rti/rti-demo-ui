[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rti-demo-ui"
version = "0.1.0"
description = "RTI Demo UI for Python (standard-library ThreadingHTTPServer backend)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "playwright==1.62.0",
    "clang-format==18.1.8",
    "pre-commit==4.6.1",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools]
package-dir = { "" = "python" }
py-modules = ["build_backend"]

[tool.setuptools.cmdclass]
build_py = "build_backend.build_py"
editable_wheel = "build_backend.editable_wheel"

[tool.setuptools.package-data]
rti_demo_ui = ["_assets/*"]

[tool.ruff]
target-version = "py310"
