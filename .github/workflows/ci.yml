name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cache/fetchcontent

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[test,lint]'
      - run: PYTHONPATH=python pytest tests/py -v
      - run: ruff check python examples/py tests/py
      - run: ruff format --check python examples/py tests/py

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('cpp/CMakeLists.txt') }}
      - run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('cpp/CMakeLists.txt') }}
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pyproject.toml') }}
      - run: npm ci --ignore-scripts
        working-directory: tools/scene3d
      - run: npm run build:runtime3d
        working-directory: tools/scene3d
      - run: sha256sum --check assets/runtime3d.sha256
      - run: git diff --exit-code -- assets/runtime3d.js assets/runtime3d.sha256
      - run: >-
          cmake -S . -B build-browser
          -DBUILD_TESTING=OFF
          -DRTI_DEMO_BUILD_EXAMPLES=ON
          -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR"
      - run: cmake --build build-browser --target rti_demo_ui_arm3d --parallel
      - run: |
          ARM3D="$(find "$PWD/build-browser" -type f -name rti_demo_ui_arm3d -perm -111 -print -quit)"
          test -n "$ARM3D"
          test -x "$ARM3D"
          echo "RTI_DEMO_CPP_ARM3D=$ARM3D" >> "$GITHUB_ENV"
      - run: pip install -e '.[browser]'
      - run: playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium
      - run: PYTHONPATH=python pytest tests/browser -v

  native-webview-spike:
    runs-on: ubuntu-22.04
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_NOHASHDIR: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            native/python/pyproject.toml
      - name: Cache native CMake dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: >-
            ${{ runner.os }}-native-cmake-deps-${{
            hashFiles(
              'cpp/CMakeLists.txt',
              'native/cpp/CMakeLists.txt'
            ) }}
      - name: Cache native C++ compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-native-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-native-ccache-
      - name: Install native engine prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            dbus-x11 \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgl1-mesa-dri \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            xvfb
      - name: Install Python native dependencies
        run: |
          python -m pip install \
            -e . \
            -e native/python \
            pytest==8.4.2
      - name: Build production C++ native host and consumer
        run: |
          cmake -S native/cpp \
            -B build/native-phase2 \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR" \
            -DRTI_DEMO_NATIVE_BUILD_EXAMPLES=ON \
            -DRTI_DEMO_NATIVE_REAL_ENGINE_TESTS=ON
          cmake --build build/native-phase2 --parallel
          cmake -S native/cpp/tests/consumer \
            -B build/native-consumer \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR" \
            -DRTI_DEMO_UI_SOURCE_DIR="$PWD"
          cmake --build build/native-consumer --parallel
      - name: Run native lifecycle tests
        run: |
          PYTHONPATH=python:native/python/src \
            python -m pytest native/python/tests -q
          ctest --test-dir build/native-phase2 \
            --output-on-failure \
            -LE real_engine
      - name: Run real native engine conformance
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" \
            bash -euo pipefail <<'SCRIPT'
          work="$RUNNER_TEMP/native-webview"
          production_cpp="./build/native-phase2/tests/rti_demo_ui_native_real_conformance"
          rm -rf "$work"
          mkdir -p "$work"

          XDG_DATA_HOME="$work/phase2-python-smoke" \
            timeout 40s python - <<'PY'
          import asyncio

          from rti_demo_ui import DemoUiApp
          from rti_demo_ui_native import run_native

          async def close_after_start(_app):
              await asyncio.sleep(0.5)

          run_native(
              DemoUiApp("Native Phase 2 Python smoke"),
              application_id="org.rti.phase2-smoke",
              async_main=close_after_start,
          )
          PY
          XDG_DATA_HOME="$work/phase2-python-signal" \
            timeout --kill-after=5s --preserve-status --signal=INT 4s \
            python - <<'PY'
          from rti_demo_ui import DemoUiApp
          from rti_demo_ui_native import run_native

          run_native(
              DemoUiApp("Native Phase 2 Python signal smoke"),
              application_id="org.rti.phase2-signal",
          )
          PY
          XDG_DATA_HOME="$work/phase2-cpp-signal" \
            ctest --test-dir build/native-phase2 \
              --output-on-failure \
              -L real_engine
          XDG_DATA_HOME="$work/phase3-cpp-consumer" \
            timeout 40s ./build/native-consumer/rti_demo_ui_native_consumer

          mkdir -p "$work/wheels"
          python -m pip wheel --no-deps \
            --wheel-dir "$work/wheels" . native/python
          python -m venv --system-site-packages "$work/release-venv"
          "$work/release-venv/bin/pip" install --no-deps "$work"/wheels/*.whl
          (
            cd "$work"
            XDG_DATA_HOME="$work/phase3-python-wheel" \
              timeout 40s "$work/release-venv/bin/python" - <<'PY'
          import asyncio

          from rti_demo_ui import DemoUiApp
          from rti_demo_ui_native import run_native

          async def close_after_start(_app):
              await asyncio.sleep(0.5)

          run_native(
              DemoUiApp("Installed native wheel smoke"),
              application_id="org.rti.phase3-wheel-smoke",
              async_main=close_after_start,
          )
          PY
          )

          XDG_DATA_HOME="$work/production-python" \
            timeout 40s python native/python/tests/real_conformance.py \
              --application-id org.rti.phase2.same \
              --expected __absent__ \
              --write first \
              --static-root tools/native_webview_spike/conformance \
              | tee "$work/production-python-a1.log"
          XDG_DATA_HOME="$work/production-python" \
            timeout 40s python native/python/tests/real_conformance.py \
              --application-id org.rti.phase2.same \
              --expected first \
              --write second \
              --static-root tools/native_webview_spike/conformance \
              | tee "$work/production-python-a2.log"
          XDG_DATA_HOME="$work/production-python" \
            timeout 40s python native/python/tests/real_conformance.py \
              --application-id org.rti.phase2.isolated \
              --expected __absent__ \
              --write isolated \
              --static-root tools/native_webview_spike/conformance \
              | tee "$work/production-python-b1.log"

          XDG_DATA_HOME="$work/production-cpp" \
            timeout 40s "$production_cpp" __absent__ first \
              | tee "$work/production-cpp-a1.log"
          XDG_DATA_HOME="$work/production-cpp" \
            timeout 40s "$production_cpp" first second \
              | tee "$work/production-cpp-a2.log"
          cp "$production_cpp" "$work/production_cpp_isolated"
          XDG_DATA_HOME="$work/production-cpp" \
            timeout 40s "$work/production_cpp_isolated" __absent__ isolated \
              | tee "$work/production-cpp-b1.log"
          SCRIPT
      - name: Report native C++ cache statistics
        if: always()
        run: ccache --show-stats
      - name: Retain native diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-webview-logs
          path: ${{ runner.temp }}/native-webview/*.log
