[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rti-demo-ui-native"
version = "0.4.0"
description = "Optional native webview runner for RTI Demo UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rti-demo-ui>=0.4,<0.5",
    "pywebview==6.2.1; sys_platform == 'linux'",
    "PyGObject==3.50.0; sys_platform == 'linux' and python_version < '3.13'",
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
