[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rti-demo-ui"
version = "0.4.1"
description = "RTI Demo UI for Python with an asyncio/aiohttp backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
]
browser = [
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "playwright==1.62.0",
]
lint = [
    "ruff==0.6.2",
]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "playwright==1.62.0",
    "ruff==0.6.2",
    "clang-format==18.1.8",
    "pre-commit==4.6.1",
]
docs = [
    "breathe==4.36.0",
    "furo==2024.8.6",
    "myst-parser==4.0.1",
    "sphinx==8.2.3",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools]
package-dir = { "" = "python" }
py-modules = ["build_backend"]

[tool.setuptools.cmdclass]
build_py = "build_backend.build_py"
editable_wheel = "build_backend.editable_wheel"

[tool.setuptools.package-data]
rti_demo_ui = ["_assets/*"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
